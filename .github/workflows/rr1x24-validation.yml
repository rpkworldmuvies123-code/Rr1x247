name: RR1X24 validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: betstrike-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: betstrike-frontend
        run: npm ci
      - name: Build Angular frontend
        working-directory: betstrike-frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build backend solution
        run: dotnet build IS-BetStrike.sln --configuration Release

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare placeholder environment
        run: cp .env.example .env
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
