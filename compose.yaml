services:
  mssql_db:
    container_name: mssql_container
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PRODUCT_ID:-Developer}
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    volumes:
      - mssqlsystem:/var/opt/mssql
    command: /opt/mssql/bin/sqlservr
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    networks:
      - env_net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/1433'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  geradordados:
    image: geradordados
    build:
      context: .
      dockerfile: GeradorDados/Dockerfile
    networks:
      - env_net
    depends_on:
      mssql_db:
        condition: service_healthy

  apiresultados:
    image: apiresultados
    build:
      context: .
      dockerfile: ApiResultados/Dockerfile
    environment:
      RESULTADOS_DB_HOST: "${RESULTADOS_DB_HOST:-mssql_db}"
      RESULTADOS_DB_PORT: "${RESULTADOS_DB_PORT:-1433}"
      RESULTADOS_DB_NAME: "${RESULTADOS_DB_NAME:-betstrike-resultados}"
      RESULTADOS_DB_USER: "${RESULTADOS_DB_USER:-resultados}"
      RESULTADOS_DB_PASSWORD: "${RESULTADOS_DB_PASSWORD}"
      RESULTADOS_API_KEY: "${RESULTADOS_API_KEY}"
      ASPNETCORE_ENVIRONMENT: "Development"
    ports:
      - "${APIRESULTADOS_PORT:-5204}:8080"
    networks:
      - env_net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      mssql_db:
        condition: service_healthy

  apiapostas:
    image: apiapostas
    build:
      context: .
      dockerfile: ApiApostas/Dockerfile
    networks:
      - env_net
    depends_on:
      mssql_db:
        condition: service_healthy

  apipagamentos:
    image: apipagamentos
    build:
      context: .
      dockerfile: ApiPagamentos/Dockerfile
    networks:
      - env_net
    depends_on:
      mssql_db:
        condition: service_healthy

  frontend:
    image: betstrike-frontend
    build:
      context: ./betstrike-frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    networks:
      - env_net
    depends_on:
      apiresultados:
        condition: service_healthy

networks:
  env_net:
    driver: bridge

volumes:
  mssqlsystem:
