services:
  mssql_db:
    container_name: mssql_container
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PRODUCT_ID:-Developer}
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    volumes:
      - mssqlsystem:/var/opt/mssql
    command: /opt/mssql/bin/sqlservr
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    networks:
      - env_net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/1433'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  db-init:
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    user: root
    volumes:
      - ./SQL:/sql:ro
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      RESULTADOS_DB_PASSWORD: "${RESULTADOS_DB_PASSWORD}"
      APOSTAS_DB_PASSWORD: "${APOSTAS_DB_PASSWORD}"
      PAGAMENTOS_DB_PASSWORD: "${PAGAMENTOS_DB_PASSWORD}"
      DB_HOST: "mssql_db"
      DB_PORT: "1433"
    entrypoint: ["/bin/bash", "/sql/init-db.sh"]
    networks:
      - env_net
    depends_on:
      mssql_db:
        condition: service_healthy
    restart: "no"

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    networks:
      - env_net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-rr1x24}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-${RABBITMQ_PASSWORD:-CHANGE_ME_RABBITMQ_PASSWORD}}"
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks:
      - env_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  geradordados:
    image: geradordados-web
    build:
      context: .
      dockerfile: GeradorDados/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ApiResultados__BaseUrl: "http://apiresultados:8080"
      ApiResultados__ApiKey: "${RESULTADOS_API_KEY}"
      ApiResultados__ClientId: "gerador-dados"
    ports:
      - "${GERADORDADOS_PORT:-5300}:8080"
    networks:
      - env_net
    depends_on:
      apiresultados:
        condition: service_healthy
      kafka:
        condition: service_healthy

  apiresultados:
    image: apiresultados
    build:
      context: .
      dockerfile: ApiResultados/Dockerfile
    environment:
      RESULTADOS_DB_HOST: "${RESULTADOS_DB_HOST:-mssql_db}"
      RESULTADOS_DB_PORT: "${RESULTADOS_DB_PORT:-1433}"
      RESULTADOS_DB_NAME: "${RESULTADOS_DB_NAME:-rr1x24-resultados}"
      RESULTADOS_DB_USER: "${RESULTADOS_DB_USER:-resultados}"
      RESULTADOS_DB_PASSWORD: "${RESULTADOS_DB_PASSWORD}"
      RESULTADOS_API_KEY: "${RESULTADOS_API_KEY}"
      ASPNETCORE_ENVIRONMENT: "Development"
      Kafka__BootstrapServers: "kafka:9092"
    ports:
      - "${APIRESULTADOS_PORT:-5204}:8080"
    networks:
      - env_net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      db-init:
        condition: service_completed_successfully

  apiapostas:
    image: apiapostas
    build:
      context: .
      dockerfile: ApiApostas/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Apostas: "Server=${APOSTAS_DB_HOST:-mssql_db},${APOSTAS_DB_PORT:-1433};Database=${APOSTAS_DB_NAME:-rr1x24-apostas};User Id=${APOSTAS_DB_USER:-apostas};Password=${APOSTAS_DB_PASSWORD};TrustServerCertificate=True;"
      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "rr1x24-apostas"
      Jwt__Audience: "rr1x24-frontend"
      Admin__Email: "${ADMIN_EMAIL:-admin@rr1x24.example}"
      Admin__Password: "${ADMIN_PASSWORD}"
      ApiResultados__BaseUrl: "http://apiresultados:8080"
      ApiPagamentos__BaseUrl: "http://apipagamentos:8080"
      ApiPagamentos__InternalKey: "${PAGAMENTOS_INTERNAL_KEY}"
      Sincronizacao__IntervaloSegundos: "${APOSTAS_SYNC_INTERVALO:-5}"
      Kafka__BootstrapServers: "kafka:9092"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__User: "${RABBITMQ_USER:-rr1x24}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD:-${RABBITMQ_PASSWORD:-CHANGE_ME_RABBITMQ_PASSWORD}}"
    ports:
      - "${APIAPOSTAS_PORT:-5141}:8080"
    networks:
      - env_net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    depends_on:
      db-init:
        condition: service_completed_successfully
      apiresultados:
        condition: service_healthy
      apipagamentos:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  apipagamentos:
    image: apipagamentos
    build:
      context: .
      dockerfile: ApiPagamentos/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Pagamentos: "Server=${PAGAMENTOS_DB_HOST:-mssql_db},${PAGAMENTOS_DB_PORT:-1433};Database=${PAGAMENTOS_DB_NAME:-rr1x24-pagamentos};User Id=${PAGAMENTOS_DB_USER:-pagamentos};Password=${PAGAMENTOS_DB_PASSWORD};TrustServerCertificate=True;"
      InternalKey: "${PAGAMENTOS_INTERNAL_KEY}"
    ports:
      - "${APIPAGAMENTOS_PORT:-5232}:8080"
    networks:
      - env_net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    depends_on:
      db-init:
        condition: service_completed_successfully

  analyticsservice:
    image: analyticsservice
    build:
      context: .
      dockerfile: AnalyticsService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      Kafka__BootstrapServers: "kafka:9092"
      Alertas__LimiarExposicaoEuros: "${ANALYTICS_LIMIAR_EXPOSICAO:-500}"
      Alertas__LimiarApostasPorMinuto: "${ANALYTICS_LIMIAR_APOSTAS_PM:-50}"
      Alertas__LimiarTaxaGanhoAlto: "${ANALYTICS_LIMIAR_TAXA_GANHO_ALTO:-0.70}"
      Alertas__LimiarTaxaGanhoBaixo: "${ANALYTICS_LIMIAR_TAXA_GANHO_BAIXO:-0.10}"
      Alertas__MinApostasParaPadrao: "${ANALYTICS_MIN_APOSTAS_PADRAO:-20}"
      ANALYTICS_PERSIST_PATH: "/data/analytics-state.json"
    ports:
      - "${ANALYTICSSERVICE_PORT:-5400}:8080"
    volumes:
      - analytics_data:/data
    networks:
      - env_net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: rr1x24-frontend
    build:
      context: ./rr1x24-frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    networks:
      - env_net
    depends_on:
      apiapostas:
        condition: service_healthy

networks:
  env_net:
    driver: bridge

volumes:
  mssqlsystem:
  analytics_data:
