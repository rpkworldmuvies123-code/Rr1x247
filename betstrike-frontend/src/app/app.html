<a class="skip-link" href="#main-content">Skip to main content</a>

<header class="topbar" [class.admin-mode]="isAdminMode()">
  <a class="brand-link" routerLink="/games" aria-label="RR1X24 home">
    <span class="brand-mark" aria-hidden="true">RR</span>
    <span class="brand-name">RR1X24</span>
  </a>

  <button
    type="button"
    class="theme-btn"
    [attr.aria-pressed]="isLightMode()"
    [attr.aria-label]="isLightMode() ? 'Switch to dark mode' : 'Switch to light mode'"
    [attr.title]="isLightMode() ? 'Switch to dark mode' : 'Switch to light mode'"
    (click)="toggleTheme()"
  >
    @if (isLightMode()) {
      <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M21 12.8A9 9 0 1 1 11.2 3 7.2 7.2 0 0 0 21 12.8Z" fill="currentColor" />
      </svg>
    } @else {
      <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="4" fill="currentColor" />
        <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <line x1="12" y1="1.8" x2="12" y2="4.3" />
          <line x1="12" y1="19.7" x2="12" y2="22.2" />
          <line x1="1.8" y1="12" x2="4.3" y2="12" />
          <line x1="19.7" y1="12" x2="22.2" y2="12" />
          <line x1="4.7" y1="4.7" x2="6.4" y2="6.4" />
          <line x1="17.6" y1="17.6" x2="19.3" y2="19.3" />
          <line x1="17.6" y1="6.4" x2="19.3" y2="4.7" />
          <line x1="4.7" y1="19.3" x2="6.4" y2="17.6" />
        </g>
      </svg>
    }
  </button>

  @if (isAuthenticated()) {
    <div class="session">
      <nav aria-label="Main navigation">
        <a class="nav-link" [routerLink]="['/games']">Matches</a>
        <a class="nav-link" [routerLink]="['/bets']">My Bets</a>
        @if (isAdmin()) {
          <a class="nav-link" [routerLink]="['/admin/games']">Admin Matches</a>
          <a class="nav-link" [routerLink]="['/admin/users']">Admin Users</a>
          <a class="nav-link" [routerLink]="['/admin/analytics']">Analytics</a>
        }
      </nav>
      <span class="user-name">{{ username() }}</span>
      <span class="balance-chip" aria-live="polite">
        Balance:
        @if (isBalanceLoading()) {
          <span class="balance-value">...</span>
        } @else {
          <span class="balance-value">{{ balanceLabel() }}</span>
        }
      </span>
      <button type="button" class="logout-btn" (click)="logout()">Log out</button>
    </div>
  }
</header>

<main id="main-content">
  <router-outlet />
</main>
